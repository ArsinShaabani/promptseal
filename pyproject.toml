[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptseal"
version = "0.8.0"
description = "🦭 Regression testing for prompts, agents, and models. Know what breaks before you switch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arsin Shaabani" }]
keywords = ["llm", "evals", "prompt", "regression", "testing", "ci", "ai-agents", "model-comparison"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.entry-points.pytest11]
promptseal = "promptseal.pytest_plugin"

[project.urls]
Homepage = "https://github.com/ArsinShaabani/promptseal"
Issues = "https://github.com/ArsinShaabani/promptseal/issues"
Roadmap = "https://github.com/ArsinShaabani/promptseal/blob/main/ROADMAP.md"

[project.scripts]
promptseal = "promptseal.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Focus on real errors and bugs (pycodestyle errors + pyflakes); skip style modernization.
select = ["E4", "E7", "E9", "F"]